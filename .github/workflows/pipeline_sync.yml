name: EPL 2026/27 Live Simulation Pipeline

on:
  schedule:
    # Refresh the live feed every night at midnight UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to click a button in GitHub to force a run manually whenever you want

permissions:
  contents: write # Grants the workflow permissions to push data changes back to the repository

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Code
      uses: actions/checkout@v4

    - name: 2. Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up execution by caching your dependencies

    - name: 3. Install Production Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Execute Web Scraper & Harvester
      run: python src/ingestion.py

    - name: 5. Rebuild Team Ratings
      run: python scripts/build_ratings.py

    - name: 6. Run Monte Carlo Simulation
      run: python epl_2526_simulator.py

    - name: 7. Commit and Push Updated Data
      run: |
        git config --global user.name "GitHub Actions Automation Bot"
        git config --global user.email "actions@github.com"
        
        # Stage live inputs and generated dashboard data.
        git add data/epl_2526_results.csv data/epl_match_results.csv data/team_ratings.csv data/all_simulated_universes_raw.csv data/season_summary.json
        
        # Commit only if the data files actually changed
        git diff-index --quiet HEAD || git commit -m "🤖 Automated Cron Sync: Updated Monte Carlo Simulation Logs [Skip CI]"
        
        # Push the fresh simulation dataset back up to the main branch
        git push
