name: Simulation Performance Tracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night at 12:00 AM UTC

jobs:
  track-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Syntax Compilation Check
      run: |
        python -m py_compile app.py epl_2526_simulator.py

    - name: Execute Model Performance Backtest
      run: |
        python src/backtest.py
